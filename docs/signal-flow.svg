<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -8 956 326" width="956" height="326" role="img" aria-label="Signal flow: the noisy audio goes through an STFT; its complex spectrum is multiplied by a smoothed gain and resynthesised. The gain comes either from a Wiener-style rule (spectral gate) or from a neural network fed with mel band features (hybrid). Both use the same noise-floor tracker.">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16212b"/></marker></defs>
  <rect x="-16" y="-8" width="956" height="326" rx="12" fill="#ffffff"/>
  <g fill="none" stroke="#16212b" stroke-width="1.4" marker-end="url(#arr)">
    <line x1="110" y1="53" x2="150" y2="53"/>
    <line x1="280" y1="53" x2="624" y2="53"/>
    <line x1="656" y1="53" x2="690" y2="53"/>
    <line x1="800" y1="53" x2="830" y2="53"/>
    <line x1="215" y1="76" x2="215" y2="130"/>
    <line x1="280" y1="153" x2="330" y2="153"/>
    <line x1="215" y1="176" x2="215" y2="230"/>
    <line x1="280" y1="253" x2="330" y2="253"/>
    <polyline points="480,153 520,153 520,193 565,193"/>
    <polyline points="480,253 520,253 520,213 565,213"/>
    <line x1="640" y1="180" x2="640" y2="69"/>
  </g>
  <g fill="#ffffff" stroke="#16212b" stroke-width="1.4">
    <rect x="10" y="30" width="100" height="46" rx="8"/>
    <rect x="150" y="30" width="130" height="46" rx="8"/>
    <circle cx="640" cy="53" r="16"/>
    <rect x="690" y="30" width="110" height="46" rx="8"/>
    <rect x="830" y="30" width="84" height="46" rx="8"/>
    <rect x="138" y="130" width="154" height="46" rx="8"/>
    <rect x="330" y="130" width="150" height="46" rx="8" stroke-dasharray="5 4"/>
    <rect x="138" y="230" width="154" height="46" rx="8"/>
    <rect x="330" y="230" width="150" height="46" rx="8" style="stroke:#b4530a;stroke-width:2.2"/>
    <rect x="565" y="180" width="150" height="46" rx="8"/>
  </g>
  <g fill="#16212b" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="12.5" text-anchor="middle">
    <text x="60" y="57" font-weight="600">Noisy audio</text>
    <text x="215" y="50" font-weight="600">STFT</text><text x="215" y="66" font-size="11">512-point, hop 128</text>
    <text x="640" y="59" font-size="18">×</text>
    <text x="745" y="50" font-weight="600">Inverse STFT</text><text x="745" y="66" font-size="11">overlap-add</text>
    <text x="872" y="57" font-weight="600">Clean audio</text>
    <text x="215" y="150" font-weight="600">Noise-floor tracker</text><text x="215" y="166" font-size="11">10th percentile, 100 frames</text>
    <text x="405" y="150" font-weight="600">Wiener-style gain rule</text><text x="405" y="166" font-size="11">per FFT bin</text>
    <text x="215" y="250" font-weight="600">Band features</text><text x="215" y="266" font-size="11">40 mel bands, 4 frames</text>
    <text x="405" y="250" font-weight="600">Neural network</text><text x="405" y="266" font-size="11">MLP 320-128-128-40</text>
    <text x="640" y="200" font-weight="600">Gain smoothing</text><text x="640" y="216" font-size="11">attack, release, floor</text>
    <g font-size="11">
      <text x="452" y="46">complex spectrum X</text>
      <text x="222" y="107" text-anchor="start">magnitude |X|</text>
      <text x="311" y="146">|X|, N</text>
      <text x="222" y="207" text-anchor="start">|X|, noise estimate N</text>
      <text x="311" y="246">320</text>
      <text x="405" y="122">Spectral gate (DSP only)</text>
      <text x="405" y="294" style="fill:#b4530a" font-weight="600">Hybrid (DSP + neural)</text>
      <text x="528" y="147" text-anchor="start">257 bin gains</text>
      <text x="528" y="270" text-anchor="start">40 band gains, spread to 257 bins</text>
      <text x="648" y="128" text-anchor="start">smoothed gain G</text>
    </g>
  </g>
</svg>
